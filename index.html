<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKDSE 視藝科卷一 (視覺形式表達主題) - 本機智慧評估系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background-color: white; }
      .no-print { display: none !important; }
      .print-shadow { box-shadow: none !important; border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 頂部標題列 -->
    <header class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded font-medium mb-1">
          本機規則引擎版 · 免 API Key
        </div>
        <h1 class="text-2xl font-bold text-slate-900">HKDSE 視覺藝術科卷一：視覺形式表達主題</h1>
        <p class="text-sm text-slate-500 mt-0.5">依據考評局四大範疇規準評審（僅顯示分數範圍，不顯示總分）</p>
      </div>
      <button onclick="window.print()" class="no-print bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm px-4 py-2 rounded-lg border border-slate-300 transition-colors">
        列印 / 存為 PDF
      </button>
    </header>

    <!-- 輸入區塊 -->
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6 no-print">
      <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-2">作品資料與特質設定</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">創作題目 / 主題</label>
          <input type="text" id="topicInput" placeholder="例：囚牢中的遐想 / 時代的痕跡" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">使用媒介與技法</label>
          <input type="text" id="mediumInput" placeholder="例：塑膠彩配水性色粉、混合拼貼" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <!-- 四大範疇本機評估選項 -->
      <div class="space-y-4 pt-2">
        <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide">按作品表現選取對應水平：</h3>

        <!-- 1. 媒材及技法 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="block font-semibold text-slate-800 text-sm mb-1">1. 媒材及技法的選擇和運用</label>
          <select id="criterionMedia" class="w-full border border-slate-300 rounded-md p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="17-20">能選擇及掌握精準而有效的媒材及技法來貫徹主題 (17-20)</option>
            <option value="13-16" selected>能掌握相當而有效的媒材及技法來突顯主題 (13-16)</option>
            <option value="9-12">能掌握適當的媒材及技法來表現主題 (9-12)</option>
            <option value="5-8">能運用與主題相關的媒材及技法 (5-8)</option>
            <option value="1-4">未能運用相關的媒材及技法來處理主題 (1-4)</option>
            <option value="0">未能展示任何技巧掌握 (0)</option>
          </select>
        </div>

        <!-- 2. 視覺元素及設計原理 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="block font-semibold text-slate-800 text-sm mb-1">2. 視覺元素及設計原理的選擇和運用</label>
          <select id="criterionElements" class="w-full border border-slate-300 rounded-md p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="17-20">能選擇及掌握多樣、精準而有效的視覺語言及設計原理來貫徹主題 (17-20)</option>
            <option value="13-16" selected>掌握多樣而適當的視覺語言及設計原理來突顯主題 (13-16)</option>
            <option value="9-12">能掌握適當的視覺語言及設計原理來表現主題 (9-12)</option>
            <option value="5-8">能運用與主題相關的視覺語言及設計原理 (5-8)</option>
            <option value="1-4">未能運用相關的視覺語言及設計原理來處理主題 (1-4)</option>
            <option value="0">未能展示相關能力 (0)</option>
          </select>
        </div>

        <!-- 3. 創意與想像力 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="block font-semibold text-slate-800 text-sm mb-1">3. 創意與想像力</label>
          <select id="criterionCreativity" class="w-full border border-slate-300 rounded-md p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="17-20">能展示個性、獨創性和嶄新的想像 (17-20)</option>
            <option value="13-16">能展示個性、原創性和豐富的想像 (13-16)</option>
            <option value="9-12" selected>能展示個性、原創性和移情／聯想 (9-12)</option>
            <option value="5-8">能展示個性或原創性 (5-8)</option>
            <option value="1-4">毫無個性或原創性 (1-4)</option>
            <option value="0">無顯示 (0)</option>
          </select>
        </div>

        <!-- 4. 主題傳意 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="block font-semibold text-slate-800 text-sm mb-1">4. 主題傳意</label>
          <select id="criterionCommunication" class="w-full border border-slate-300 rounded-md p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="17-20">能運用統整以切題的藝術形式／符號，表現不同層次的情感或意念 (17-20)</option>
            <option value="13-16" selected>能運用多樣而切題、並互相配合的藝術形式／符號表現情感或意念 (13-16)</option>
            <option value="9-12">能運用互相配合而切題的藝術形式／符號表現情感或意念 (9-12)</option>
            <option value="5-8">能運用互不相干但切題的藝術形式／符號表現情感或意念 (5-8)</option>
            <option value="1-4">未能運用任何切題的藝術形式／符號表現情感或意念 (1-4)</option>
            <option value="0">無顯示 (0)</option>
          </select>
        </div>
      </div>

      <button onclick="generateReport()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow transition">
        由本機引擎生成評審報告
      </button>
    </div>

    <!-- 評審報告產出區 -->
    <div id="reportSection" class="hidden bg-white border border-slate-200 rounded-xl p-8 shadow-sm space-y-6 print-shadow">
      <div class="border-b border-slate-200 pb-4">
        <h2 class="text-xl font-bold text-slate-900">卷一：視覺形式表達主題 · 評估診斷報告</h2>
        <div class="flex flex-wrap gap-4 text-xs text-slate-500 mt-2">
          <div><span class="font-semibold text-slate-700">主題：</span><span id="reportTopic">-</span></div>
          <div><span class="font-semibold text-slate-700">媒材：</span><span id="reportMedium">-</span></div>
          <div><span class="font-semibold text-slate-700">評核標準：</span>香港中學文憑試視覺藝術科量規</div>
        </div>
      </div>

      <!-- 四大範疇診斷卡片容器 -->
      <div id="criteriaCards" class="space-y-6"></div>

      <!-- 頁尾提醒 (絕不顯示總分) -->
      <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg text-xs text-amber-800">
        <strong>備註：</strong>依據香港文憑試視覺藝術科卷一質性評審指引，本系統僅提供各項能力之分數區間、表現歸因與增潤建議，不提供單一總分，以利聚焦於視覺語言及創作思維的提升。
      </div>
    </div>

  </div>

  <script>
    // 預設規則引擎評語庫
    const rubricData = {
      media: {
        title: "媒材及技法的選擇和運用",
        reasons: {
          "17-20": "對所選媒材之物理特性（如覆蓋力、厚度、流動感）具備精湛的駕馭力，筆觸與肌理層次純熟，完整支撐畫面意境。",
          "13-16": "有效掌握所用材料的技術要領，手法乾淨俐落，能利用適當的技法特質突顯畫面焦點與氛圍。",
          "9-12": "具備基本的媒材控制能力，能完成畫面描繪，但技巧層面多依循常規操作，未見鮮明的技法個性。",
          "5-8": "作品雖具備媒材痕跡，但控制能力較為生硬，偶有顏料混濁或技法處理不勻之處，影響畫面清晰度。",
          "1-4": "尚未掌握該媒材之基礎處理方式，媒介運用與題材表現有明顯斷層。",
          "0": "無任何技法展示。"
        },
        shortcomings: {
          "17-20": "整體表現高度成熟，若能進一步在局部質感上創造更多微細層次的變化，將更具震撼力。",
          "13-16": "部分次要區域的筆觸或細部肌理處理稍嫌均質，未能進一步深化視覺張力。",
          "9-12": "層次感略顯單薄，對於媒介特有肌理（如乾擦、重疊、留白等）的探索程度有限。",
          "5-8": "技法與媒介的結合顯得被動，技藝尚未能自然地融入創作概念之中。",
          "1-4": "媒介掌握不足，以致技術缺陷干擾了觀者對圖像內容的理解。",
          "0": "未呈現出實質創作。"
        },
        suggestions: {
          "17-20": "可嘗試在作品中引入複合媒介的微實驗，拓展觸感與空間氛圍的邊界。",
          "13-16": "可針對主體與背景交界處，精細微調邊緣清晰度（Edge Control），加強視覺空間層次。",
          "9-12": "建議在草圖紙上記錄 2-3 種不同的材質塗抹實驗，並挑選最具衝擊力者加強至主要物體上。",
          "5-8": "建議加強基礎調色及水分/厚度控制練習，避免畫面局部因過度塗抹而失去透光感與生動度。",
          "1-4": "宜重新檢視所選媒材之特性，先掌握一種核心媒介之基本工具操作再擴展創作。",
          "0": "請務必按考卷規定呈交對應作品。"
        }
      },
      elements: {
        title: "視覺元素及設計原理的選擇和運用",
        reasons: {
          "17-20": "敏銳且精確地調配色彩對比、空間透視與構圖律動，成功引導觀者視線並完全服務於主題情境。",
          "13-16": "構圖平穩且具層次，色調冷暖佈局得宜，視覺中心明確且各元素具良好平衡感。",
          "9-12": "能依循基礎設計原理安排畫面元素，畫面比例合宜，但佈局略顯制式或可預期。",
          "5-8": "畫面元素分佈較為分散或繁雜，視覺重心不夠聚焦，使畫面結構略為失衡。",
          "1-4": "視覺語言混亂，缺乏明確之空間結構或色彩關係，削弱了圖像傳達力。",
          "0": "未能體現相關視覺原理。"
        },
        shortcomings: {
          "17-20": "整體統整性極高，若能適度留白以營造更多畫面呼吸感，畫面將更具餘韻。",
          "13-16": "色彩對比或明度階梯（Value Scale）可以更大膽，目前部分層次有些微灰調收斂。",
          "9-12": "構圖較為仰賴對稱或居中安排，視角與透視關係略顯單一，缺乏打破框架的視覺張力。",
          "5-8": "未充分考量「主次分明」，背景與前景之比重相互爭奪焦點。",
          "1-4": "缺乏對色彩、線條與空間之基本統籌，畫面顯得零散無序。",
          "0": "未展示視覺設計組織。"
        },
        suggestions: {
          "17-20": "可嘗試引入更有張力的視角（如超俯視、極限仰角或微觀剪裁）來昇華構圖。",
          "13-16": "試著在主體區域增強光影對比階梯（最亮與最暗），將視線焦點鎖定得更強烈。",
          "9-12": "建議在白書紙上繪製 3 幅不同視角的縮圖（Thumbnail sketches），跳脫直覺式構圖。",
          "5-8": "釐清畫面的「視覺第一印象點」，精簡並刪除對主題無實質助益的瑣碎元素。",
          "1-4": "建議先由黑白素描稿規劃出三大塊明度分配（黑、灰、白），建立畫面秩序。",
          "0": "請按照視覺元素要求組織畫面。"
        }
      },
      creativity: {
        title: "創意與想像力",
        reasons: {
          "17-20": "展現高度獨創性與極富哲思的隱喻視角，跳脫既定陳腔濫調，呈現前所未見的個人化世界觀。",
          "13-16": "構思新穎生動，能將不同的事物意象進行有趣的移情或並置聯想，想像力豐富。",
          "9-12": "具備個人解讀視角，能對題目作合乎邏輯的聯想，但聯想層次尚在多數人的直觀預期內。",
          "5-8": "呈現之點子偏向直接字面翻譯或刻板符號，個人個性與創新元素稍顯薄弱。",
          "1-4": "幾乎全為公式化或概念拼貼，未能感受任何原創思維與想像力投入。",
          "0": "無顯示個性或原創性。"
        },
        shortcomings: {
          "17-20": "觀念強烈，若能讓符號的隱喻在草圖書紙中交代得更為深邃，將更有說服力。",
          "13-16": "部分象徵意象仍略帶常見圖像範本的影子，個人原創符號的提煉度可再加深。",
          "9-12": "意象轉化較為直接（如講到悲傷就畫眼淚），未深入挖掘更深層的精神投射。",
          "5-8": "創作概念主要停留於表層字面解釋，缺乏視覺隱喻的轉換層次。",
          "1-4": "構思過於平板或直接仿作，未見考生自我的思考觀點。",
          "0": "無展現原創性。"
        },
        suggestions: {
          "17-20": "可在草圖紙中加入觀念的演變過程筆記，展現個人概念從萌芽到蛻變的脈絡。",
          "13-16": "嘗試使用「非慣用邏輯聯想」（如矛盾並置、超現實比例放大）來取代常態符號。",
          "9-12": "在白書紙上利用「意念網絡（Mind Map）」進行至少三層延伸，避開第一時間想到的三個符號。",
          "5-8": "多觀察日常生活細節，嘗試將個人真實感受或獨特記憶注入畫作中。",
          "1-4": "多閱讀不同流派的藝術家作品，學習如何將抽象觀念轉化為具象符號。",
          "0": "請根據題目展開思考創作。"
        }
      },
      communication: {
        title: "主題傳意",
        reasons: {
          "17-20": "藝術形式、象徵符號與情感基調完美融合為一，多層次地喚起觀者的心理共鳴與反思。",
          "13-16": "符號多樣且切合題意，彼此之間呼應得當，能清晰傳遞出考生的感受與核心意念。",
          "9-12": "所用圖像符號能有效配合題目，題意明確清晰，但情感層次較為單一平鋪。",
          "5-8": "符號雖與題目有一定關聯，但元素之間各自為政，未能形成合力以突顯情感意念。",
          "1-4": "未能運用適當的符號闡釋主題，觀者難以從畫面接收到明確的思維訊息。",
          "0": "完全偏離主題。"
        },
        shortcomings: {
          "17-20": "已具備極高的感染力，近乎無可挑剔。",
          "13-16": "情感鋪陳若能再加強一些張弛節奏（如對立情感的拉扯），傳意效果會更深層。",
          "9-12": "意念表達以敘事居多，缺少直擊心靈的情感共鳴層次。",
          "5-8": "畫面元素之間的關聯性鬆散，削弱了訊息的傳達力度。",
          "1-4": "缺乏視覺焦點或文不對題，無法有效解構主題。",
          "0": "無題意表現。"
        },
        suggestions: {
          "17-20": "可善用白書紙的文字陳述，與畫面形成互文性（Intertextuality）的觀念呼應。",
          "13-16": "在主要符號與背景氛圍之間加強情感關聯，使色彩與造型皆成為傳意的載體。",
          "9-12": "思考「這個主題對我個人有何獨特意義」，將個人的情緒切片融入畫面中。",
          "5-8": "重新審視每個入畫物件的必要性，刪減無關物件，聚焦於單一強烈的核心意念。",
          "1-4": "仔細研讀考卷題目的關鍵字，重新定義畫面主角與主題之因果關係。",
          "0": "請務必審慎審題。"
        }
      }
    };

    function generateReport() {
      const topic = document.getElementById('topicInput').value.trim() || '未指定主題';
      const medium = document.getElementById('mediumInput').value.trim() || '常規平面媒材';

      document.getElementById('reportTopic').innerText = topic;
      document.getElementById('reportMedium').innerText = medium;

      const mediaScore = document.getElementById('criterionMedia').value;
      const elemScore = document.getElementById('criterionElements').value;
      const creatScore = document.getElementById('criterionCreativity').value;
      const commScore = document.getElementById('criterionCommunication').value;

      const criteriaKeys = [
        { key: 'media', score: mediaScore },
        { key: 'elements', score: elemScore },
        { key: 'creativity', score: creatScore },
        { key: 'communication', score: commScore }
      ];

      const container = document.getElementById('criteriaCards');
      container.innerHTML = '';

      criteriaKeys.forEach(item => {
        const cat = rubricData[item.key];
        const card = document.createElement('div');
        card.className = "border border-slate-200 rounded-lg p-5 bg-slate-50/50 space-y-3";

        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-200 pb-2">
            <h3 class="font-bold text-slate-800">${cat.title}</h3>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
              等級區間：${item.score} 分
            </span>
          </div>
